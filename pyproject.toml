[project]
name = "mtg-collection"
version = "0.1.0"
description = "Self-hosted Magic: The Gathering collection manager with phone scanning, pricing and an MCP server."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.10",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.15",
    "python-multipart>=0.0.20",
    "rapidfuzz>=3.13",
    "tzdata>=2025.1",
    "collectorvision[hf]",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "rapidocr>=3.10.0",
    "numpy>=2",
    "pillow>=12.3.0",
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Body"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.uv.sources]
collectorvision = { git = "https://github.com/HanClinto/CollectorVision.git", rev = "8b295ab80a997766afc00c640a616c1f2716df21" }
